<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyabula Mock Eye Renderer</title>
<style>
  @font-face{font-family:"NyabulaTitle";src:url("./fonts/AlimamaShuHeiTi.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"NyabulaBody";src:url("./fonts/MiSans-Semibold.ttf") format("truetype");font-weight:600;font-display:swap}
  @font-face{font-family:"NyabulaEnglish";src:local("Times New Roman Bold"),local("TimesNewRomanPS-BoldMT");font-weight:700}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"NyabulaBody","MiSans","Microsoft YaHei",sans-serif;user-select:none}
  #stage{position:absolute;inset:0;display:block;cursor:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="./icons/material_icon_paths.js"></script>
<script>
"use strict";
/* ============================================================
 * Nyabula cat-eye vector animation demo
 * 全参数化：每帧目标参数 target -> 弹簧/指数插值 -> 绘制
 * 便于后续移植：draw(ctx, cx, cy, R, side, S) 即单眼渲染入口
 * ============================================================ */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth;H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize); resize();

/* ---------- 工具 ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const KAPPA=0.5523;
const SCREEN_RADIUS_SCALE=1.0;
const FONT_TITLE_CN='"NyabulaTitle","MiSans","Microsoft YaHei",sans-serif';
const FONT_BODY_CN='"NyabulaBody","MiSans","Microsoft YaHei",sans-serif';
const FONT_EN='"NyabulaEnglish","Times New Roman",serif';
const FONT_MIXED='"NyabulaEnglish","Times New Roman","NyabulaBody","MiSans",sans-serif';
const fontTitle=px=>`${px|0}px ${FONT_TITLE_CN}`;
const fontBody=px=>`600 ${px|0}px ${FONT_BODY_CN}`;
const fontEnglish=px=>`700 ${px|0}px ${FONT_EN}`;
const fontMixed=px=>`700 ${px|0}px ${FONT_MIXED}`;
const MATERIAL_ICONS=window.NYABULA_MATERIAL_ICONS||{};
const materialPathCache=new Map(),materialLengthCache=new Map();
function materialPath(name){
  if(!materialPathCache.has(name)){
    const icon=MATERIAL_ICONS[name];
    if(!icon)throw new Error(`Missing extracted SVG icon: ${name}`);
    materialPathCache.set(name,new Path2D(icon.path));
  }
  return materialPathCache.get(name);
}
function materialPathLength(name){
  if(!materialLengthCache.has(name)){
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',MATERIAL_ICONS[name].path);
    materialLengthCache.set(name,path.getTotalLength());
  }
  return materialLengthCache.get(name);
}
function iconReveal(startedAt=sceneStartedAt){
  const start=Math.max(startedAt,optionChangedAt);
  return sceneEase(clamp((tNow-start)/.72,0,1));
}
function iconSceneAlpha(){
  if(!scenePhase.startsWith('closing'))return 1;
  return 1-sceneEase(clamp(scenePhaseT/SCENE_CLOSE_TIME,0,1));
}
function drawMaterialIcon(name,IR,C,{size=1.18,reveal=iconReveal(),alpha=1,rotation=0,sceneAlpha=iconSceneAlpha()}={}){
  const icon=MATERIAL_ICONS[name];
  if(!icon)return;
  const length=materialPathLength(name),fillIn=sceneEase(clamp((reveal-.46)/.54,0,1));
  const scale=IR*size/icon.viewBox[2];
  ctx.save();ctx.globalAlpha*=alpha*sceneAlpha;ctx.rotate(rotation);ctx.scale(scale,scale);
  ctx.translate(-icon.viewBox[2]/2,-icon.viewBox[3]/2);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=18;
  ctx.strokeStyle=rgba(C,lerp(.88,.20,fillIn));
  ctx.setLineDash([length,length]);ctx.lineDashOffset=length*(1-reveal);
  ctx.stroke(materialPath(name));
  if(fillIn>0){ctx.setLineDash([]);ctx.fillStyle=rgba(C,.92*fillIn);ctx.fill(materialPath(name));}
  ctx.restore();
}
function cubicBezier01(t,c1,c2){
  t=clamp(t,0,1);
  const u=1-t;
  return 3*u*u*t*c1+3*u*t*t*c2+t*t*t;
}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function rgba(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
function shade(c,f){return c.map(v=>clamp(v*f,0,255));}

/* ---------- 眼睛状态参数（全部可插值） ---------- */
function mkParams(){return {
  pupilW: .35,   // 瞳孔宽度比例 0.10(细竖缝)~1(全圆)
  pupilH: .78,   // 瞳孔高度比例
  lidTop: 0,     // 上眼睑闭合 0~1
  lidBot: 0,     // 下眼睑闭合 0~1
  lidSlant: 0,   // 上睑倾斜 -1(外高内低=凶) ~ 1(内高外低=委屈)
  botCurve: 0,   // 下睑上弯(笑) 0~1
  gazeX: 0, gazeY: 0,    // 注视偏移 -1~1
  irisScale: 1,  // 虹膜整体缩放（惊讶放大）
  glow: .5,      // 外发光强度
  overlay: 0,    // 特效元素透明度(星星/爱心/处理环)
  squint: 0,     // 整眼压扁
  derp: 0,       // 呆滞外八：双瞳向外分离+一高一低 0~1
};}
const cur=mkParams(), tgt=mkParams();
const SPEED={pupilW:8,pupilH:8,lidTop:22,lidBot:22,lidSlant:6,botCurve:6,
  gazeX:10,gazeY:10,irisScale:7,glow:4,overlay:6,squint:8,derp:5};

/* ---------- 全局 ---------- */
let mode='idle', modeT=0;          // 当前模式 + 进入模式经过秒数
let irisHexL='#38e06e', irisHexR='#38e06e';
let lightLvl=.55;                  // 环境光 0~1
let blinkPhase=-1;                 // -1 无眨眼, 0..1 眨眼进度
let blinkEyes='both';
let nextBlink=2.5, nextSaccade=1.2, saccade={x:0,y:0};
let lookTarget=null, lookHold=0;   // 点击注视
let sleepStartTop=0, sleepStartBot=0;
let sleepEndTop=.86, sleepEndBot=.14;
let tPrev=performance.now()/1000, tNow=tPrev;
let timerDurationMs=300000,timerRemainingMs=300000,timerStatus='running',timerSyncedAt=tNow;
let taskProgress=null,taskProgressDisplay=null,taskProgressFrom=null;
let taskProgressTarget=null,taskProgressFade=1,taskPrevProgress=null;
let taskTitle=null,taskPrevTitle=null;

/* ---------- Eye scene state machine ----------
 * Scenes are an information layer, not expressions. Content is swapped only
 * while both eyes are closed, so the same lifecycle can map to LVGL later.
 */
let sceneType=null, scenePrevType=null, scenePending=null, sceneStartedAt=0;
let scenePrevStartedAt=0;
let scenePhase='none', scenePhaseT=0, sceneLid=0;
let sceneStyle='full', scenePendingStyle=null, sceneFade=1;
let weatherKind='rain', weatherPrevKind=null, weatherFade=1;
let musicView='spectrum', musicPrevView=null, musicViewFade=1;
let alarmCopy='name';
let alarmPrevCopy=null,alarmPrev=null;
let alarmLabel='早安，Nyabula', alarmDetail='喝水 · 吃药', alarmTriggerUnixMs=0;
let mediaTitle='NYABULA MIX', mediaArtist='', mediaDurationMs=235000;
let mediaPositionMs=0, mediaStatus='playing', mediaSyncedAt=tNow;
let mediaPrevStatus=null,mediaPrev=null,timerPrev=null,callPrevState=null,callPrev=null;
let callName='BEACON', callNumber='+86 138 0013 8000';
let networkState='wifi', audioRoute='speaker', eqView='profile', optionFade=1, optionChangedAt=-Infinity;
let networkPrevState=null, audioPrevRoute=null, eqPrevView=null, batteryPrevState=null, taskPrevState=null;
let batteryState='charging', callState='incoming', taskState='running';
let scenePayload={},scenePrevPayload=null,scenePayloadDisplay={};
let scenePayloadFrom={},scenePayloadFade=1;
const SCENE_NUMERIC_FIELDS=new Set(['duration_ms','position_ms','remaining_ms','elapsed_ms',
  'percent','device_count','briefing_index','briefing_count','temperature_c','feels_like_c',
  'humidity_percent','wind_kph','visibility_km','distance_m','heart_rate_bpm','crossover_hz','progress',
  'media_duration_ms','media_position_ms','timer_duration_ms','timer_remaining_ms','task_progress']);
const SCENE_CLOCK_FIELDS=new Set(['media_synced_at_ms','timer_presented_at_ms','present_until_ms']);
const SCENE_CLOSE_TIME=.38, SCENE_OPEN_TIME=.52, SCENE_FADE_TIME=.32;
function sceneEase(t){
  t=clamp(t,0,1);
  return cubicBezier01(t,.08,.92);
}
function withStateMotion(IR,incoming,draw){
  const p=sceneEase(optionFade),visible=incoming?p:1-p;
  ctx.save();
  ctx.globalAlpha*=visible;
  const scale=.78+.22*visible;
  ctx.scale(scale,scale);
  draw(p);
  ctx.restore();
}
function stateRingAngles(incoming){
  const p=sceneEase(optionFade);
  return {alpha:incoming?p:1-p,start:-Math.PI/2};
}
function setSceneButton(type){
  document.querySelectorAll('[data-scene]').forEach(b=>
    b.classList.toggle('on',b.dataset.scene===type));
}
function setWeather(kind){
  document.querySelectorAll('[data-weather]').forEach(b=>
    b.classList.toggle('on',b.dataset.weather===kind));
  if(kind!==weatherKind){
    weatherPrevKind=weatherKind;
    weatherKind=kind;
    weatherFade=0;
  }
  if(sceneType!=='weather' && scenePending!=='weather')showScene('weather');
}
function setMusicView(view){
  document.querySelectorAll('[data-music-view]').forEach(b=>
    b.classList.toggle('on',b.dataset.musicView===view));
  if(view!==musicView){
    musicPrevView=musicView;
    musicView=view;
    musicViewFade=0;
  }
  if(sceneType!=='music' && scenePending!=='music')showScene('music');
}
function setAlarmCopy(copy){
  alarmCopy=copy;
  document.querySelectorAll('[data-alarm-copy]').forEach(b=>
    b.classList.toggle('on',b.dataset.alarmCopy===copy));
  if(sceneType!=='alarm' && scenePending!=='alarm')showScene('alarm');
}
function setSceneOption(selector,value,type,setter){
  document.querySelectorAll(selector).forEach(b=>
    b.classList.toggle('on',b.dataset[setter]===value));
  const current={network:networkState,audio:audioRoute,eq:eqView,battery:batteryState,call:callState,task:taskState}[type];
  if(current!==value){
    if(type==='network'){networkPrevState=networkState;networkState=value;}
    else if(type==='audio'){audioPrevRoute=audioRoute;audioRoute=value;}
    else if(type==='eq')eqView=value;
    else if(type==='battery'){batteryPrevState=batteryState;batteryState=value;}
    else if(type==='call')callState=value;
    else {taskPrevState=taskState;taskState=value;}
    optionFade=0;
    optionChangedAt=tNow;
  }
  if(sceneType!==type && scenePending!==type)showScene(type);
}
function setSceneStyleButton(style){
  document.querySelectorAll('[data-scene-style]').forEach(b=>
    b.classList.toggle('on',b.dataset.sceneStyle===style));
}
function setSceneStyle(style){
  if(style===sceneStyle && !scenePendingStyle)return;
  setSceneStyleButton(style);
  if(!sceneType){
    sceneStyle=style;
    scenePendingStyle=null;
    return;
  }
  if(sceneStyle==='minimal' && style==='full'){
    sceneStyle='full';
    scenePrevType=null;
    sceneFade=1;
    scenePhase='reopening-in';
    scenePhaseT=0;
    return;
  }
  scenePending=sceneType;
  scenePendingStyle=style;
  scenePhase='closing-switch';
  scenePhaseT=sceneLid*SCENE_CLOSE_TIME;
}
function wakeForScene(){
  if(mode!=='sleep')return;
  /* Sleep is already visually closed. Keep that closure instead of briefly
   * reopening the idle eye before the scene swap. */
  sceneLid=1;
  mode='idle'; modeT=0;
  document.querySelectorAll('[data-mode]').forEach(b=>
    b.classList.toggle('on',b.dataset.mode==='idle'));
}
function showScene(type){
  wakeForScene();
  if(sceneStyle==='minimal' && sceneType && scenePhase==='visible'){
    if(sceneType===type)return;
    scenePrevType=sceneType;
    scenePrevStartedAt=sceneStartedAt;
    sceneType=type;
    sceneStartedAt=tNow;
    sceneFade=0;
    setSceneButton(type);
    return;
  }
  scenePending=type;
  scenePhase=sceneType?'closing-switch':'closing-in';
  scenePhaseT=sceneLid*SCENE_CLOSE_TIME;
  setSceneButton(type);
}
function hideScene(){
  scenePending=null;
  scenePendingStyle=null;
  scenePrevType=null;
  if(!sceneType && scenePhase==='none')return;
  if(sceneStyle==='minimal' && sceneType){
    /* Minimal scenes live on the closed eyelid surface. Reveal the real eye
     * underneath while the old scene remains clipped to, and fades with,
     * the retreating lids. */
    scenePhase='reopening-minimal-out';
    scenePhaseT=0;
    sceneLid=1;
    sceneFade=1;
    setSceneButton(null);
    return;
  }
  scenePhase='closing-out';
  scenePhaseT=sceneLid*SCENE_CLOSE_TIME;
  setSceneButton(null);
}
function updateScene(dt){
  if(optionFade<1){
    optionFade=clamp(optionFade+dt/.42,0,1);
    if(optionFade>=1){
      networkPrevState=null;audioPrevRoute=null;eqPrevView=null;batteryPrevState=null;
      taskPrevState=null;taskPrevTitle=null;taskPrevProgress=null;callPrevState=null;
      alarmPrevCopy=null;alarmPrev=null;mediaPrevStatus=null;mediaPrev=null;
      timerPrev=null;callPrev=null;scenePrevPayload=null;
    }
  }
  if(taskProgressTarget!==null&&taskProgressDisplay!==taskProgressTarget){
    taskProgressFade=clamp(taskProgressFade+dt/.52,0,1);
    taskProgressDisplay=lerp(taskProgressFrom,taskProgressTarget,sceneEase(taskProgressFade));
    if(taskProgressFade>=1)taskProgressDisplay=taskProgressTarget;
  }
  if(scenePayloadFade<1){
    scenePayloadFade=clamp(scenePayloadFade+dt/.52,0,1);
    const p=sceneEase(scenePayloadFade),next={...scenePayload};
    for(const key of SCENE_NUMERIC_FIELDS){
      if(Number.isFinite(scenePayload[key]))next[key]=lerp(
        Number(scenePayloadFrom[key]??scenePayload[key]),Number(scenePayload[key]),p);
    }
    if(Array.isArray(scenePayload.eq_bands))next.eq_bands=scenePayload.eq_bands.map((value,index)=>
      lerp(Number(scenePayloadFrom.eq_bands?.[index]??value),Number(value),p));
    scenePayloadDisplay=next;
  }else scenePayloadDisplay={...scenePayload};
  if(weatherFade<1){
    weatherFade=clamp(weatherFade+dt/SCENE_FADE_TIME,0,1);
    if(weatherFade>=1)weatherPrevKind=null;
  }
  if(sceneFade<1){
    sceneFade=clamp(sceneFade+dt/SCENE_FADE_TIME,0,1);
    if(sceneFade>=1)scenePrevType=null;
  }
  if(musicViewFade<1){
    musicViewFade=clamp(musicViewFade+dt/SCENE_FADE_TIME,0,1);
    if(musicViewFade>=1)musicPrevView=null;
  }
  if(scenePhase==='none'||scenePhase==='visible')return;
  scenePhaseT+=dt;
  if(scenePhase.startsWith('closing')){
    const p=clamp(scenePhaseT/SCENE_CLOSE_TIME,0,1);
    sceneLid=sceneEase(p);
    if(p>=1){
      if(scenePhase==='closing-out'){
        sceneType=null;
        scenePrevType=null;
        scenePhase='reopening-out';
      }else{
        sceneType=scenePending;
        sceneStartedAt=tNow;
        scenePending=null;
        if(scenePendingStyle){
          sceneStyle=scenePendingStyle;
          scenePendingStyle=null;
        }
        scenePrevType=null;
        sceneFade=sceneStyle==='minimal'?0:1;
        scenePhase=sceneStyle==='minimal'?'visible':'reopening-in';
      }
      scenePhaseT=0;
    }
  }else if(scenePhase==='reopening-minimal-out'){
    const p=clamp(scenePhaseT/SCENE_OPEN_TIME,0,1);
    sceneLid=1-sceneEase(p);
    sceneFade=1-sceneEase(clamp(p/.86,0,1));
    if(p>=1){
      sceneType=null;
      scenePrevType=null;
      sceneLid=0;
      sceneFade=1;
      scenePhase='none';
      scenePhaseT=0;
    }
  }else if(scenePhase.startsWith('reopening')){
    const p=clamp(scenePhaseT/SCENE_OPEN_TIME,0,1);
    sceneLid=1-sceneEase(p);
    if(p>=1){
      sceneLid=0;
      scenePhase=scenePhase==='reopening-in'?'visible':'none';
      scenePhaseT=0;
    }
  }
}

/* ---------- 模式目标参数 ---------- */
function applyMode(dt){
  const p=tgt, t=modeT;
  // 基线：环境光决定瞳孔（竖瞳<->散瞳），真实猫：亮->细缝，暗->大圆
  const dil = 1-lightLvl;                       // 0亮 1暗
  p.pupilW = lerp(.10,.95, dil*dil*.3+dil*.7);  // 非线性，暗端更快变圆
  p.pupilH = lerp(.72,.95, dil);
  p.lidTop=0;p.lidBot=0;p.lidSlant=0;p.botCurve=0;
  p.gazeX=0;p.gazeY=0;
  p.irisScale=1;p.glow=.5;p.overlay=0;p.squint=0;p.derp=0;

  switch(mode){
    case 'idle':
      // 呼吸感：瞳孔轻微律动
      p.pupilW *= 1+Math.sin(t*1.1)*.04;
      break;
    case 'curious':
      p.pupilW=Math.min(.9,p.pupilW*1.5+.25); p.pupilH=.95;   // 好奇=散瞳
      p.irisScale=1.06; p.glow=.75;
      break;
    case 'happy':
      p.botCurve=1; p.lidBot=.28; p.squint=.15;
      p.pupilW=Math.min(.85,p.pupilW+.2);
      p.glow=.85;
      break;
    case 'processing':
      p.pupilW=.95;p.pupilH=.95; p.overlay=1; p.glow=.6;
      break;
    case 'star': case 'heart':
      p.pupilW=0;p.pupilH=0; p.overlay=1; p.irisScale=1.08; p.glow=1;
      p.botCurve=.5;p.lidBot=.1;
      break;
    case 'sleepy':
      p.lidTop=.55;p.lidBot=.15; p.pupilW=Math.max(p.pupilW,.5);
      p.gazeY=.25; p.glow=.3;
      break;
    case 'sleep':
      // 从进入睡眠瞬间的眼睑位置直接闭合，不先回到完全睁眼状态
      const sleepClose=cubicBezier01(clamp(t/1.8,0,1),.08,.92);
      p.lidTop=lerp(sleepStartTop,sleepEndTop,sleepClose);
      p.lidBot=lerp(sleepStartBot,sleepEndBot,sleepClose);
      p.glow=lerp(.4,.15,Math.min(1,t/2)); p.overlay=sleepClose>.98?1:0;
      p.gazeY=.2;
      break;
    case 'angry':
      p.lidTop=.32; p.lidSlant=1; p.pupilW=.13;p.pupilH=.8;
      p.squint=.2; p.glow=.7;
      break;
    case 'sad':
      p.lidTop=.3; p.lidSlant=-.9; p.lidBot=.12;
      p.pupilW=Math.min(.9,p.pupilW+.3); p.gazeY=.3; p.glow=.35;
      p.overlay= t>1.2 ? 1:0;   // 泪光延迟出现
      break;
    case 'surprise':
      p.pupilW=.98;p.pupilH=.98; p.irisScale=1.14; p.glow=1;
      if(t<.25){p.irisScale=1.2;}
      break;
    case 'dizzy':
      p.pupilW=0;p.pupilH=0;p.overlay=1;
      p.lidTop=.15;p.lidSlant=.3;
      break;
    case 'derp':
      // 表情包同款：大圆瞳外八、一高一低，上眼睑保持完全睁开
      p.derp=1; p.pupilW=.8;p.pupilH=.86;
      p.lidTop=0; p.glow=.45;
      // 偶尔轻晃，更呆
      p.gazeX=Math.sin(t*.7)*.05;
      break;
  }
}

/* ---------- 行为：眨眼 / 扫视 ---------- */
function behaviors(dt){
  // 眨眼
  if(sceneType||scenePhase!=='none'){
    blinkPhase=-1;
  }else if(blinkPhase>=0){
    blinkPhase+=dt*4.2;
    if(blinkPhase>=1)blinkPhase=-1;
  } else if(mode!=='sleep'){
    nextBlink-=dt;
    if(nextBlink<=0){blinkEyes='both';blinkPhase=0;nextBlink=2.2+Math.random()*4.5;
      if(Math.random()<.18)nextBlink=.35;}   // 偶发双眨
  }
  // 扫视（idle/curious 自主看）
  if(lookTarget){ lookHold-=dt; if(lookHold<=0)lookTarget=null; }
  if(!lookTarget && (mode==='idle'||mode==='curious'||mode==='happy')){
    nextSaccade-=dt;
    if(nextSaccade<=0){
      nextSaccade=1.2+Math.random()*2.8;
      saccade.x=(Math.random()*2-1)*.55; saccade.y=(Math.random()*2-1)*.35;
      if(Math.random()<.3){saccade.x=0;saccade.y=0;}
    }
  }
  if(mode==='sleepy'){ saccade.x=Math.sin(tNow*.4)*.15; saccade.y=.2; }
  if(mode==='processing'){ saccade.x=0; saccade.y=-.1; }
  if(mode==='dizzy'||mode==='derp'){ saccade.x=0;saccade.y=0; }
  if(lookTarget){ tgt.gazeX=lookTarget.x; tgt.gazeY=lookTarget.y; }
  else { tgt.gazeX=clamp(tgt.gazeX+saccade.x,-1,1); tgt.gazeY=clamp(tgt.gazeY+saccade.y,-1,1); }
}

/* ---------- 主循环 ---------- */
function tick(){
  tNow=performance.now()/1000; let dt=Math.min(.05,tNow-tPrev); tPrev=tNow;
  modeT+=dt;
  applyMode(dt); behaviors(dt); updateZzz(dt); updateScene(dt);
  for(const k in SPEED){ cur[k]=lerp(cur[k],tgt[k],1-Math.exp(-SPEED[k]*dt)); }
  // 眨眼使用三次贝塞尔缓入缓出；闭合略快、睁开略慢，总时长约 240ms
  let blink=0;
  if(blinkPhase>=0){
    if(blinkPhase<.46){
      blink=cubicBezier01(blinkPhase/.46,.08,.92);
    }else{
      blink=1-cubicBezier01((blinkPhase-.46)/.54,.08,.92);
    }
  }
  const zzzMaskTarget=mode==='sleep'?clamp(cur.lidTop+cur.lidBot,0,1):0;
  zzzMask=lerp(zzzMask,zzzMaskTarget,1-Math.exp(-SPEED.lidTop*dt));
  if(mode!=='sleep' && zzzMask<.002)zzz.length=0;
  render(blink);
  if(!window.__ready)window.__ready=true;
  requestAnimationFrame(tick);
}

/* ---------- 渲染 ---------- */
function render(blink){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const R=Math.min(W*.16,H*.30);          // 单眼半径
  const gap=R*2.7, cy=H*.46;
  const CR=R*SCREEN_RADIUS_SCALE;         // 圆屏边缘与默认虹膜外缘重合
  for(const side of [-1,1]){
    const ex=W/2+side*gap/2;
    ctx.save();
    ctx.beginPath(); ctx.arc(ex,cy,CR,0,7); ctx.clip();
    const eyeBlink=blinkEyes==='both'||(blinkEyes==='left'&&side<0)||
      (blinkEyes==='right'&&side>0)?blink:0;
    drawEye(ex,cy,R,side,eyeBlink);
    drawZzz(side,ex,cy,R,CR);
    ctx.restore();
    // 屏圈（bezel）
    ctx.strokeStyle='rgba(60,70,85,.45)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ex,cy,CR,0,7); ctx.stroke();
  }
}

/* 构造眼睑覆盖区域。绘制眼睑和裁剪 Zzz 共用同一条路径，
 * 这样睁眼时粒子会跟随逐渐退开的黑色眼睑一起消失。
 */
function makeLidPath(E,lidT,lidB,slant,botCurve){
  const path=new Path2D();
  const topEdge=-E+lidT*E*2;
  const topLeft=topEdge-slant*E*.35;
  const topRight=topEdge+slant*E*.35;
  const topBulge=E*.16*clamp(lidT*2,0,1);

  path.moveTo(-E*1.3,-E*1.3); path.lineTo(E*1.3,-E*1.3);
  path.lineTo(E*1.3,topRight);
  path.bezierCurveTo(E*.4,topRight+topBulge,
                     -E*.4,topLeft+topBulge,-E*1.3,topLeft);
  path.closePath();

  const bottomEdge=E-lidB*E*2;
  const bottomBulge=-botCurve*E*.55-E*.16*clamp(lidB*2,0,1);
  // 与上眼睑保持相同环绕方向，使重叠区域成为并集而不是互相抵消。
  path.moveTo(-E*1.3,bottomEdge);
  path.bezierCurveTo(-E*.45,bottomEdge+bottomBulge,
                     E*.45,bottomEdge+bottomBulge,E*1.3,bottomEdge);
  path.lineTo(E*1.3,E*1.3); path.lineTo(-E*1.3,E*1.3);
  path.closePath();

  return path;
}

/* 单眼。side: -1 左 1 右 */
function drawEye(cx,cy,R,side,blink){
  const S=cur;
  const irisHex = side<0? irisHexL : irisHexR;
  const IC=hexRgb(irisHex);
  const squishY = 1 - S.squint*.25;
  const gx=S.gazeX*R*.30 + side*S.derp*R*.24;         // 外八：各自朝外
  const gy=S.gazeY*R*.26 + side*S.derp*R*.11 + S.derp*R*.06;  // 一高一低+整体微垂
  const minimalSceneExit=sceneType&&sceneStyle==='minimal'&&scenePhase==='reopening-minimal-out';

  ctx.save();
  ctx.translate(cx,cy);

  if(sceneType&&!minimalSceneExit){
    if(sceneStyle==='minimal'){
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(0,0,R*1.08,0,7);ctx.fill();
      if(scenePrevType){
        drawScene(R*1.08,IC,side,scenePrevType,1-sceneFade,true,scenePrevStartedAt);
      }
      drawScene(R*1.08,IC,side,sceneType,sceneFade,true,sceneStartedAt);
    }else{
      drawScene(R*1.08,IC,side,sceneType,1,false,sceneStartedAt);
      ctx.fillStyle='#000';
      ctx.fill(makeLidPath(R*1.05,.86*sceneLid,.14*sceneLid,0,0));
    }
    ctx.restore();
    return;
  }

  if(mode==='dizzy'){ ctx.rotate(Math.sin(tNow*3+side)*0.06); }
  ctx.scale(1,squishY);

  /* 外发光 */
  const glowA = S.glow*.5;
  let g=ctx.createRadialGradient(0,0,R*.4,0,0,R*1.9);
  g.addColorStop(0,rgba(IC,glowA*.35)); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,R*1.9,0,7); ctx.fill();

  /* 眼眶剪裁（杏仁形：圆 + 睑遮盖，睑在最后画） */
  const IR=R*S.irisScale;

  /* 虹膜底 */
  ctx.save();
  ctx.beginPath(); ctx.arc(0,0,IR,0,7); ctx.clip();
  g=ctx.createRadialGradient(gx*.5,gy*.5,IR*.1, 0,0,IR);
  g.addColorStop(0, rgba(shade(IC,1.25),1));
  g.addColorStop(.55,rgba(IC,1));
  g.addColorStop(.85,rgba(shade(IC,.55),1));
  g.addColorStop(1, rgba(shade(IC,.30),1));
  ctx.fillStyle=g; ctx.fillRect(-IR,-IR,IR*2,IR*2);

  /* 虹膜纤维纹理：放射细线 */
  ctx.globalAlpha=.16;
  ctx.strokeStyle=rgba(shade(IC,1.6),1); ctx.lineWidth=1;
  for(let i=0;i<48;i++){
    const a=i/48*Math.PI*2 + Math.sin(i*7)*0.1;
    const r1=IR*(.28+((i*37)%13)/13*.15), r2=IR*(.82+((i*53)%7)/7*.14);
    ctx.beginPath();
    ctx.moveTo(gx+Math.cos(a)*r1, gy+Math.sin(a)*r1);
    ctx.lineTo(gx*.3+Math.cos(a)*r2, gy*.3+Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  /* 瞳孔（矢量透镜形：细缝<->圆 形变） */
  const pw=S.pupilW, ph=S.pupilH;
  if(pw>0.01 && ph>0.01){
    const w=IR*pw*.80, h=IR*ph*.84;
    ctx.save(); ctx.translate(gx,gy);
    // 暗瞳带微光
    g=ctx.createRadialGradient(0,0,0,0,0,Math.max(w,h));
    g.addColorStop(0,'#101216'); g.addColorStop(.8,'#05070a'); g.addColorStop(1,'#000');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,0,w,h,0,0,7);
    ctx.fill();
    // 瞳缘亮边（虹膜内环）
    ctx.strokeStyle=rgba(shade(IC,1.7),.5); ctx.lineWidth=IR*.02; ctx.stroke();
    ctx.restore();
  }

  /* 特效 overlay */
  if(S.overlay>0.02) drawOverlay(IR,gx,gy,IC,S.overlay,side);

  /* 高光（两点，随注视反向微移，制造球面感） */
  ctx.globalAlpha=.9;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-IR*.33+gx*.55,-IR*.38+gy*.55,IR*.13,IR*.10,-.5,0,7); ctx.fill();
  ctx.globalAlpha=.45;
  ctx.beginPath(); ctx.arc(IR*.30+gx*.6,IR*.24+gy*.6,IR*.05,0,7); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore(); /* iris clip */

  /* 眼睑：黑色遮盖（上/下），含倾斜 & 笑眼下弯 & 眨眼 */
  // 真实闭眼以上眼睑下落为主；下眼睑只轻微上提。若表情本身已经
  // 抬高下眼睑，则保持该高度，再由上眼睑补足剩余闭合行程。
  blink=Math.max(blink,sceneLid);
  const blinkBotTarget=Math.max(.14,S.lidBot);
  const blinkTopTarget=Math.max(S.lidTop,1-blinkBotTarget);
  const lidT=clamp(lerp(S.lidTop,blinkTopTarget,blink),0,1);
  const lidB=clamp(lerp(S.lidBot,blinkBotTarget,blink),0,1);
  ctx.fillStyle='#000';
  const E=IR*1.04;
  // 上睑：曲线边缘。slant: -1 外高内低（凶） 1 内高外低（哀）
  // 眨眼时逐渐拉平表情倾斜，否则斜眼睑的一端会留下一道缝。
  const slant=S.lidSlant*side*-1*(1-blink);
  const lidPath=makeLidPath(E,lidT,lidB,slant,S.botCurve*(1-blink));
  ctx.fill(lidPath);
  if(minimalSceneExit){
    ctx.save();
    ctx.clip(lidPath);
    drawScene(R*1.08,IC,side,sceneType,sceneFade,true,sceneStartedAt);
    ctx.restore();
  }
  ctx.restore();

}

/* ---------- 睡眠 Zzz 粒子 ---------- */
/* ---------- Eye scenes ---------- */
function sceneGlow(IC,a=1){
  const C=shade(IC,1.75);
  ctx.shadowColor=rgba(C,.9*a);
  ctx.shadowBlur=18*a;
  return C;
}
function currentMediaState(){
  const durationMs=Number.isFinite(scenePayloadDisplay.media_duration_ms)
    ?scenePayloadDisplay.media_duration_ms:Number.isFinite(scenePayloadDisplay.duration_ms)
      ?scenePayloadDisplay.duration_ms:mediaDurationMs;
  const positionMs=Number.isFinite(scenePayloadDisplay.media_position_ms)
    ?scenePayloadDisplay.media_position_ms:Number.isFinite(scenePayloadDisplay.position_ms)
      ?scenePayloadDisplay.position_ms:mediaPositionMs;
  const duration=Math.max(1,durationMs/1000);
  const liveElapsed=mediaStatus==='playing'?(tNow-mediaSyncedAt):0;
  return {title:mediaTitle,artist:mediaArtist,status:mediaStatus,
    durationMs,positionMs:clamp(positionMs+liveElapsed*1000,0,duration*1000),
    syncedAt:tNow};
}
function currentTimerState(){
  const elapsed=timerStatus==='running'?(tNow-timerSyncedAt)*1000:0;
  return {status:timerStatus,durationMs:timerDurationMs,
    remainingMs:Math.max(0,timerRemainingMs-elapsed),syncedAt:tNow};
}
function drawMusicPlaybackBase(IR,IC,C,state=currentMediaState()){
  const duration=Math.max(1,state.durationMs/1000);
  const liveElapsed=state.status==='playing'?(tNow-state.syncedAt):0;
  const elapsed=clamp(state.positionMs/1000+liveElapsed,0,duration);
  const progress=elapsed/duration;
  /* A restrained translucent album-art placeholder. A decoded cover can use
   * the same clipped background layer later without changing the layout. */
  const cover=ctx.createRadialGradient(-IR*.22,-IR*.30,IR*.03,0,0,IR*.92);
  cover.addColorStop(0,rgba(shade(IC,1.35),.18));
  cover.addColorStop(.45,rgba(IC,.08));cover.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cover;ctx.beginPath();ctx.arc(0,0,IR*.92,0,7);ctx.fill();
  /* The playback ring hugs the physical display edge instead of behaving
   * like a second, smaller dial inside it. */
  ctx.lineCap='round';ctx.lineWidth=IR*.032;
  ctx.strokeStyle=rgba(C,.16);ctx.beginPath();ctx.arc(0,0,IR*.89,-Math.PI/2,Math.PI*1.5);ctx.stroke();
  ctx.strokeStyle=rgba(C,.92);ctx.beginPath();
  ctx.arc(0,0,IR*.89,-Math.PI/2,-Math.PI/2+progress*Math.PI*2);ctx.stroke();
  const a=-Math.PI/2+progress*Math.PI*2;
  ctx.fillStyle=rgba(C,.95);ctx.beginPath();
  ctx.arc(Math.cos(a)*IR*.89,Math.sin(a)*IR*.89,IR*.024,0,7);ctx.fill();
}
function drawMusicPlaybackIcon(IR,C,status,alpha=1,scale=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.scale(scale,scale);
  ctx.translate(0,-IR*.08);ctx.fillStyle=rgba(C,.94);
  if(status==='playing'){
    const w=IR*.075,h=IR*.34,gap=IR*.075;
    ctx.beginPath();ctx.roundRect(-gap-w,-h/2,w,h,w/2);ctx.roundRect(gap,-h/2,w,h,w/2);ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(-IR*.105,-IR*.19);ctx.lineTo(IR*.205,0);ctx.lineTo(-IR*.105,IR*.19);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawMusicPlaybackText(IR,C,state=currentMediaState(),drawTitle=true){
  const duration=Math.max(1,state.durationMs/1000);
  const elapsed=clamp(state.positionMs/1000,0,duration);
  const em=String(Math.floor(elapsed/60)).padStart(2,'0');
  const es=String(Math.floor(elapsed%60)).padStart(2,'0');
  const dm=String(Math.floor(duration/60)).padStart(2,'0');
  const ds=String(Math.floor(duration%60)).padStart(2,'0');
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(drawTitle){ctx.font=fontEnglish(IR*.080);ctx.fillStyle=rgba(C,.50);
  ctx.fillText(state.title||state.artist||'NYABULA MIX',0,IR*.36);}
  ctx.font=fontEnglish(IR*.090);ctx.fillStyle=rgba(C,.76);
  ctx.fillText(`${em}:${es}  /  ${dm}:${ds}`,0,IR*.49);
}
function drawMusicSpectrum(IR,IC,C,alpha){
  ctx.save();ctx.globalAlpha*=alpha;
  /* Centre the spectrum as one visual block, including its heading. */
  ctx.translate(0,IR*.10);
  const bars=9,bw=IR*.062,gap=IR*.045;
  ctx.fillStyle=rgba(C,.32);ctx.font=fontTitle(IR*.080);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('频谱',0,-IR*.48);
  for(let i=0;i<bars;i++){
    const wave=.5+.5*Math.sin(tNow*(3.4+(i%3)*.24)+i*.88);
    const envelope=.58+.42*Math.sin((i+1)/(bars+1)*Math.PI);
    const h=IR*(.13+.49*wave*envelope),x=(i-(bars-1)/2)*(bw+gap);
    const grad=ctx.createLinearGradient(0,IR*.31,0,-IR*.31);
    grad.addColorStop(0,rgba(shade(IC,.70),.48));grad.addColorStop(1,rgba(C,.94));
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x-bw/2,-h/2,bw,h,bw/2);ctx.fill();
  }
  ctx.restore();
}
function musicLyrics(payload={}){
  return [payload.previous_line||'灯火落进夜里',payload.current_line||'我听见你',
    payload.next_line||'轻轻回应'];
}
function drawMusicLyrics(IR,C,alpha,payload=scenePayloadDisplay){
  const lines=musicLyrics(payload);
  ctx.save();ctx.globalAlpha*=alpha;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.translate(0,IR*.08);
  ctx.font=fontBody(IR*.095);ctx.fillStyle=rgba(C,.22);
  ctx.fillText(lines[0],0,-IR*.30);
  ctx.font=fontTitle(IR*.155);ctx.fillStyle=rgba(C,.94);
  ctx.fillText(lines[1],0,-IR*.03);
  ctx.font=fontBody(IR*.095);ctx.fillStyle=rgba(C,.30);
  ctx.fillText(lines[2],0,IR*.27);
  ctx.restore();
}
function drawMusicLyricsTransition(IR,C,from,to){
  const oldLines=musicLyrics(from),newLines=musicLyrics(to),p=sceneEase(optionFade);
  const y0=-IR*.30,y1=-IR*.03,y2=IR*.27,yIn=-IR*.52,yOut=IR*.52;
  ctx.save();ctx.translate(0,IR*.08);ctx.textAlign='center';ctx.textBaseline='middle';
  const line=(text,y,size,alpha,title=false)=>{ctx.font=(title?fontTitle:fontBody)(IR*size);
    ctx.fillStyle=rgba(C,alpha);ctx.fillText(text,0,y);};
  line(oldLines[2],lerp(y2,yOut,p),.095,.30*(1-p));
  if(oldLines[1]===newLines[2]){
    line(oldLines[1],lerp(y1,y2,p),lerp(.155,.095,p),lerp(.94,.30,p),p<.5);
  }else{
    line(oldLines[1],lerp(y1,y2,p),.155,.94*(1-p),true);
    line(newLines[2],lerp(y1,y2,p),.095,.30*p);
  }
  if(oldLines[0]===newLines[1]){
    line(oldLines[0],lerp(y0,y1,p),lerp(.095,.155,p),lerp(.22,.94,p),p>=.5);
  }else{
    line(oldLines[0],lerp(y0,y1,p),.095,.22*(1-p));
    line(newLines[1],lerp(y0,y1,p),.155,.94*p,true);
  }
  const enter=sceneEase(clamp((p-.08)/.92,0,1));
  line(newLines[0],lerp(yIn,y0,enter),.095,.30*enter);
  ctx.restore();
}
function drawMusicScene(IR,IC,side,minimal=false,startedAt=sceneStartedAt){
  const C=sceneGlow(IC,.65);
  if(!minimal){ctx.fillStyle='rgba(0,3,7,.68)';ctx.beginPath();ctx.arc(0,0,IR*.93,0,7);ctx.fill();}
  ctx.shadowBlur=0;
  if(side<0){
    const current=currentMediaState();
    drawMusicPlaybackBase(IR,IC,C,current);
    if(mediaPrevStatus&&mediaPrevStatus!==current.status){
      withStateMotion(IR,false,()=>drawMusicPlaybackIcon(IR,C,mediaPrevStatus));
      withStateMotion(IR,true,()=>drawMusicPlaybackIcon(IR,C,current.status));
    }else drawMusicPlaybackIcon(IR,C,current.status);
    const metadataChanged=mediaPrev&&(mediaPrev.title!==current.title||
      mediaPrev.artist!==current.artist||mediaPrev.durationMs!==current.durationMs);
    if(metadataChanged){
      withStateMotion(IR,false,()=>drawMusicPlaybackText(IR,C,mediaPrev,true));
      withStateMotion(IR,true,()=>drawMusicPlaybackText(IR,C,current,true));
    }else drawMusicPlaybackText(IR,C,current,true);
  }
  else{
    if(musicPrevView){
      if(musicPrevView==='spectrum')drawMusicSpectrum(IR,IC,C,1-musicViewFade);
      else drawMusicLyrics(IR,C,1-musicViewFade,scenePrevPayload||scenePayloadDisplay);
    }
    if(musicView==='spectrum')drawMusicSpectrum(IR,IC,C,musicViewFade);
    else if(!musicPrevView&&scenePrevPayload&&musicLyrics(scenePrevPayload).some(
      (line,index)=>line!==musicLyrics(scenePayloadDisplay)[index]))
      drawMusicLyricsTransition(IR,C,scenePrevPayload,scenePayloadDisplay);
    else drawMusicLyrics(IR,C,musicViewFade,scenePayloadDisplay);
  }
  ctx.shadowBlur=0;
}
function drawTimerScene(IR,IC,side,minimal=false,startedAt=sceneStartedAt){
  const C=sceneGlow(IC,.65);
  if(!minimal){
    ctx.fillStyle='rgba(0,3,7,.72)';
    ctx.beginPath();ctx.arc(0,0,IR*.93,0,7);ctx.fill();
  }
  ctx.shadowBlur=0;
  const drawLayer=(state,incoming)=>{
  const liveElapsed=state.status==='running'?(tNow-state.syncedAt)*1000:0;
  const precise=Math.max(0,(state.remainingMs-liveElapsed)/1000);
  const remaining=Math.ceil(precise);
  const mm=String(Math.floor(remaining/60)).padStart(2,'0');
  const ss=String(remaining%60).padStart(2,'0');
  const value=side<0?mm:ss;
  const urgency=remaining<=10&&state.status==='running'?.82+Math.sin(tNow*8)*.18:1;
  const ring=stateRingAngles(incoming);
  ctx.save();ctx.globalAlpha*=ring.alpha;
  ctx.fillStyle=rgba(C,.96*urgency);
  ctx.font=fontEnglish(IR*.62);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(value,0,-IR*.02);
  ctx.font=fontBody(IR*.115);ctx.fillStyle=rgba(C,.48);
  ctx.fillText(side<0?'分钟':'秒钟',0,IR*.34);
  ctx.lineCap='round';ctx.lineWidth=IR*.035;
  ctx.strokeStyle=rgba(C,.22);
  ctx.beginPath();ctx.arc(0,0,IR*.72,-Math.PI/2,Math.PI*1.5);ctx.stroke();
  const p=state.durationMs>0?precise/(state.durationMs/1000):0;
  ctx.strokeStyle=rgba(C,.82);
  ctx.beginPath();ctx.arc(0,0,IR*.72,-Math.PI/2,-Math.PI/2+p*Math.PI*2);ctx.stroke();
  ctx.strokeStyle=rgba(C,.18);ctx.lineWidth=IR*.011;
  for(let i=0;i<30;i++){
    const a=i*Math.PI/15,inner=i%5===0?.61:.64;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*IR*inner,Math.sin(a)*IR*inner);
    ctx.lineTo(Math.cos(a)*IR*.67,Math.sin(a)*IR*.67);ctx.stroke();
  }
  ctx.restore();
  withStateMotion(IR,incoming,()=>{
    ctx.font=fontBody(IR*.076);ctx.fillStyle=rgba(C,.34);
    const status={running:'计时中',paused:'已暂停',completed:'已完成'}[state.status]||'';
    if(status)ctx.fillText(status,0,IR*.49);
  });
  };
  if(timerPrev){drawLayer(timerPrev,false);drawLayer(currentTimerState(),true);}
  else{
    const state=currentTimerState();
    const saved=optionFade;optionFade=1;drawLayer(state,true);optionFade=saved;
  }
  ctx.shadowBlur=0;
}
function drawRainDrop(x,y,size,C,alpha,tilt=-.12){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(tilt);ctx.globalAlpha*=alpha;
  ctx.fillStyle=rgba(C,.95);
  ctx.beginPath();
  ctx.moveTo(0,-size*.72);
  ctx.bezierCurveTo(size*.08,-size*.46,size*.32,-size*.12,size*.32,size*.10);
  ctx.bezierCurveTo(size*.32,size*.40,size*.17,size*.58,0,size*.58);
  ctx.bezierCurveTo(-size*.17,size*.58,-size*.32,size*.40,-size*.32,size*.10);
  ctx.bezierCurveTo(-size*.32,-size*.12,-size*.08,-size*.46,0,-size*.72);
  ctx.fill();
  ctx.restore();
}
function makeCloudPath(IR,dx=0,dy=0){
  const p=new Path2D();
  p.moveTo(dx-IR*.46,dy+IR*.18);
  p.bezierCurveTo(dx-IR*.49,dy+IR*.05,dx-IR*.43,dy-IR*.15,dx-IR*.24,dy-IR*.18);

function drawCompanionScene(IR,IC,side,minimal=false){
  const C=sceneGlow(IC,.43);drawSceneBackdrop(IR,minimal,.74);ctx.shadowBlur=0;ctx.textAlign='center';ctx.textBaseline='middle';
  if(side<0){
    /* Pass one slow breath from the centre outwards, then leave a long rest.
     * Staggering the layers feels organic without becoming a ripple loop. */
    const cycle=6.8,phase=tNow%cycle;
    const layerBreath=delay=>{
      const p=phase-delay;
      if(p<0||p>=2.15)return 0;
      if(p<1.05)return sceneEase(p/1.05);
      if(p<1.30)return 1;
      return 1-sceneEase((p-1.30)/.85);
    };
    for(let i=3;i>=0;i--){
      const breath=layerBreath(i*.22);
      const radius=IR*(.22+i*.11)*(.90+breath*.24);
      ctx.fillStyle=rgba(C,.050+i*.032+breath*.026);
      ctx.beginPath();ctx.arc(0,0,radius,0,7);ctx.fill();
    }
    drawMaterialIcon('companion',IR,C,{size:.48,alpha:.94});
  }else{
    ctx.fillStyle=rgba(C,.98);ctx.font=fontTitle(IR*.22);ctx.fillText('专注陪伴',0,-IR*.17);
    ctx.fillStyle=rgba(C,.50);ctx.font=fontBody(IR*.09);ctx.fillText('安静模式',0,IR*.10);

  else if(type==='devices')drawDevicesScene(IR,IC,side,minimal);
  else if(type==='system')drawSystemScene(IR,IC,side,minimal);
  else if(type==='health')drawHealthScene(IR,IC,side,minimal);
  else if(type==='presence')drawPresenceScene(IR,IC,side,minimal);
  else if(type==='companion')drawCompanionScene(IR,IC,side,minimal);
  else if(type==='home')drawCatHomeScene(IR,IC,side,minimal);
  else if(type==='subwoofer')drawSubwooferScene(IR,IC,side,minimal);
  ctx.restore();
}

const zzz=[]; let zNext=0, zzzMask=0;
function updateZzz(dt){
  const R=Math.min(W*.16,H*.30), CR=R*SCREEN_RADIUS_SCALE;
  if(mode==='sleep' && cur.lidTop+cur.lidBot>.92){
    zNext-=dt;
    if(zNext<=0){
      zNext=.8+Math.random()*1.2;
      const vy=-(CR*.30+Math.random()*CR*.15);
      const size=R*(.15+Math.random()*.15);
      for(const side of [-1,1]){
        zzz.push({
          side,
          ox:(Math.random()*2-1)*CR*.55,     // 两眼同时生成，各自保留自然漂移
          y:CR*1.1,                          // 相对屏心：从屏底下方进入
          vy,
          sway:CR*(.08+Math.random()*.10),
          ph:Math.random()*7, size,
          life:0, rot:(Math.random()-.5)*.5
        });
      }
    }
  }
  for(let i=zzz.length-1;i>=0;i--){
    const z=zzz[i]; z.life+=dt; z.y+=z.vy*dt;
    if(z.y<-CR*1.2) zzz.splice(i,1);         // 飘出屏顶回收
  }
}
function drawZzz(side,ex,cy,R,CR){
  const S=cur;
  const IR=R*S.irisScale;
  const E=IR*1.04;
  const lidT=sleepEndTop*zzzMask;
  const lidB=sleepEndBot*zzzMask;

  ctx.save();
  ctx.translate(ex,cy);
  ctx.scale(1,1-S.squint*.25);
  ctx.clip(makeLidPath(E,lidT,lidB,0,0));
  ctx.globalAlpha*=sceneEase(zzzMask);

  for(const z of zzz){
    if(z.side!==side)continue;
    const p=clamp((CR*1.1-z.y)/(CR*2.2),0,1);        // 底→顶进度
    const a=Math.sin(p*Math.PI);                     // 入淡入、出淡出
    ctx.save();
    ctx.translate(z.ox+Math.sin(z.life*2+z.ph)*z.sway,z.y);
    ctx.rotate(z.rot+Math.sin(z.life*1.5+z.ph)*.15);
    ctx.globalAlpha=a*.85;
    ctx.fillStyle='rgba(165,195,255,1)';
    ctx.font=fontEnglish(z.size*(1+p*.5));
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Z',0,0);
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- 特效元素 ---------- */
function star(ctx,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=rot+i*Math.PI/5, rr=i%2?r*.45:r;
    ctx[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
}
function heart(ctx,r){
  ctx.beginPath();
  ctx.moveTo(0,r*.9);
  ctx.bezierCurveTo( r*1.1,r*.25,  r*.95,-r*.75, 0,-r*.25);
  ctx.bezierCurveTo(-r*.95,-r*.75, -r*1.1,r*.25, 0,r*.9);
  ctx.closePath();
}
function drawOverlay(IR,gx,gy,IC,alpha,side){
  ctx.save(); ctx.translate(gx,gy); ctx.globalAlpha=alpha;
  if(mode==='processing'){
    // 彗星拖尾旋环 + 中心呼吸点 + 涟漪扩散（大瞳内"运算"感）
    const rot=tNow*2.6, BC=shade(IC,1.9);
    // 彗尾：分段弧，透明度递减
    ctx.lineCap='round';
    for(let i=0;i<14;i++){
      const a0=rot-i*.16, seg=.17;
      ctx.strokeStyle=rgba(BC,(1-i/14)**1.6*.95);
      ctx.lineWidth=IR*.055*(1-i/14*.6);
      ctx.beginPath(); ctx.arc(0,0,IR*.46,a0-seg,a0+.02); ctx.stroke();
    }
    // 彗头亮点
    ctx.fillStyle='#fff'; ctx.shadowColor=rgba(BC,1); ctx.shadowBlur=IR*.15;
    ctx.beginPath(); ctx.arc(Math.cos(rot)*IR*.46,Math.sin(rot)*IR*.46,IR*.05,0,7); ctx.fill();
    ctx.shadowBlur=0;
    // 反向细外环（低速衬托）
    ctx.globalAlpha=alpha*.35;
    ctx.strokeStyle=rgba(BC,1); ctx.lineWidth=IR*.02;
    ctx.beginPath(); ctx.arc(0,0,IR*.62,-rot*.5,-rot*.5+2.4); ctx.stroke();
    ctx.globalAlpha=alpha;
    // 中心呼吸点
    const br=.7+.3*Math.sin(tNow*4);
    ctx.fillStyle=rgba(BC,.55+br*.4);
    ctx.beginPath(); ctx.arc(0,0,IR*.055*(1+br*.5),0,7); ctx.fill();
    // 涟漪：完整扩散淡出后停顿 200ms，再开始下一轮，避免视觉回抽。
    const rippleDuration=1/.9;
    const ripplePause=.2;
    const rippleTime=modeT%(rippleDuration+ripplePause);
    if(rippleTime<rippleDuration){
      const rp=rippleTime/rippleDuration;
      ctx.strokeStyle=rgba(BC,(1-rp)*.5); ctx.lineWidth=IR*.02;
      ctx.beginPath(); ctx.arc(0,0,IR*.08+rp*IR*.3,0,7); ctx.stroke();
    }
  } else if(mode==='star'){
    const pulse=1+Math.sin(tNow*5)*.12;
    const rot=Math.sin(tNow*1.5)*.25;
    ctx.fillStyle='#ffd94d';
    ctx.shadowColor='#ffd94d'; ctx.shadowBlur=IR*.35;
    star(ctx,IR*.5*pulse,rot-Math.PI/2); ctx.fill();
    ctx.shadowBlur=0;
    // 小碎星
    for(let i=0;i<2;i++){
      const a=tNow*2+i*3+side, r=IR*.75;
      ctx.globalAlpha=alpha*(.4+.3*Math.sin(tNow*4+i*2));
      ctx.fillStyle='#fff3b8';
      star(ctx,IR*.09,a);
      ctx.save();ctx.translate(Math.cos(a)*r,Math.sin(a)*r*.8);star(ctx,IR*.09,a);ctx.fill();ctx.restore();
    }
  } else if(mode==='heart'){
    const beat = (tNow*1.6)%1;
    const pulse = 1 + (beat<.15? Math.sin(beat/.15*Math.PI)*.18 : beat<.3? Math.sin((beat-.15)/.15*Math.PI)*.10 : 0);
    ctx.fillStyle='#ff4d79';
    ctx.shadowColor='#ff4d79'; ctx.shadowBlur=IR*.4;
    heart(ctx,IR*.5*pulse); ctx.fill();
    ctx.shadowBlur=0;
  } else if(mode==='dizzy'){
    // 螺旋瞳
    const rot=tNow*4*(side<0?1:-1);
    ctx.strokeStyle='#0a0c10'; ctx.lineWidth=IR*.09; ctx.lineCap='round';
    ctx.beginPath();
    for(let a=0;a<Math.PI*5;a+=.15){
      const r=IR*.55*a/(Math.PI*5);
      const x=Math.cos(a+rot)*r,y=Math.sin(a+rot)*r;
      a?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  } else if(mode==='sad'){
    // 泪光：下缘水膜
    ctx.globalAlpha=alpha*(.5+.2*Math.sin(tNow*2));
    const g2=ctx.createLinearGradient(0,IR*.3,0,IR);
    g2.addColorStop(0,'rgba(180,220,255,0)');
    g2.addColorStop(1,'rgba(190,225,255,.55)');
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(0,0,IR*.98,0,7); ctx.fill();
  }
  ctx.restore();
}

/* Pure renderer: all interaction arrives from Nyabula Core. */
const eyeFontsReady=document.fonts?Promise.all([
  document.fonts.load('32px NyabulaTitle','中文标题'),
  document.fonts.load('600 24px NyabulaBody','中文正文'),
  document.fonts.load('700 24px NyabulaEnglish','NYABULA 123')
]):Promise.resolve();
eyeFontsReady.then(()=>{
  document.documentElement.dataset.eyeFonts='ready';
  tick();
},()=>{
  document.documentElement.dataset.eyeFonts='fallback';
  tick();
});
